name: Build Android APK (Android 15)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Keystores and Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Inject Gemini API Key into environment files
          echo "GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}" > .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY_SECRET}" > .env.example
          
          # 2. Setup debug.keystore required by debugConfig at root
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64 in repo..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding debug.keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
          fi
          
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Decode Release Keystore if provided in GitHub Secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Release Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          fi

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS || secrets.CM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD || secrets.CM_KEY_PASSWORD }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS || secrets.CM_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD || secrets.CM_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (if Keystore is provided)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: my-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS || secrets.CM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD || secrets.CM_KEY_PASSWORD }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS || secrets.CM_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD || secrets.CM_KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Building Signed Release APK..."
            ./gradlew assembleRelease --stacktrace || echo "Release build failed, will still publish Debug APK."
          else
            echo "Release keystore not found, skipping signed release build."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Call-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Call-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Generate Build Summary
        run: |
          echo "### 📱 تم بناء تطبيق AI Phone Call بنجاح! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "تجد ملفات الـ **APK** جاهزة للتحميل والتثبيت المباشر في قسم **Artifacts** أسفل صفحة هذا التشغيل:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| الحزمة (Package) | الحالة (Status) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI-Phone-Call-Debug-APK** | ✅ تم البناء والتغليف بنجاح |" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/release/"*.apk 2>/dev/null ]; then
            echo "| **AI-Phone-Call-Release-APK** | ✅ تم التوقيع والبناء بنجاح |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "قم بتنزيل ملف الـ ZIP من Artifacts وفك ضغطه لتثبيت ملف \`.apk\` على هاتفك مباشرة." >> $GITHUB_STEP_SUMMARY
